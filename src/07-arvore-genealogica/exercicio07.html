<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/poo-javascript-lab/src/styles.css">
    <link rel="stylesheet" href="/poo-javascript-lab/src/07-arvore-genealogica/exercicio07.css">

</head>

<body>
    <!-- Menu Lateral -->
    <div class="app-container">
        <aside class="sidebar">
            <h2>Exercícios JS</h2>
            <nav>
                <ul>
                    <a href="/poo-javascript-lab/src/01-forma-geometrica/exercicio01.html">
                        <li><button data-ex="1">1. Formas Geométricas</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.html">
                        <li><button data-ex="2">2. Agenda Telefônica</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/03-controle-de-emprestimo/exercicio03.html">
                        <li><button data-ex="3">3. Controle de Empréstimo</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/04-funcionario-e-gerente/exercicio04.html">
                        <li><button data-ex="4">4. Funcionário & Gerente</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/05-simulador-de-futebol/exercicio05.html">
                        <li><button data-ex="5">5. Simulador de Futebol</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/06-supermercado/exercicio06.html">
                        <li><button data-ex="6">6. Supermercado</button></li>
                    </a>
                    <li><button data-ex="7">7. Árvore Genealógica</button></li>
                    <li><button data-ex="8">8. Gestão da Turma</button></li>
                </ul>
            </nav>
        </aside>

        <!-- Main - Contúdo  -->

        <main class="main-content">
            <div class="card">
                <h2>Nova Árvore Genealógica</h2>
            
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pessoa Principal</label>
                        <input type="text" id="nome" placeholder="Nome completo">
                        <input type="number" id="idade" placeholder="Idade">
                    </div>
            
                <div class="form-group">
                <label>Pais</label>
                <input type="text" id="nomePai" placeholder="Nome do pai">
                <input type="number" id="idadePai" placeholder="Idade do pai">
                
                <input type="text" id="nomeMae" placeholder="Nome da mãe">
                <input type="number" id="idadeMae" placeholder="Idade da mãe">
                </div>
            
                    <div class="form-group">
                        <label>Avós Paternos</label>
                        <input type="text" id="nomeAvoPaterno" placeholder="Avô Paterno">
                        <input type="text" id="nomeAvoPaterna" placeholder="Avó Paterna">
                    </div>
            
                    <div class="form-group">
                        <label>Avós Maternos</label>
                        <input type="text" id="nomeAvoMaterno" placeholder="Avô Materno">
                        <input type="text" id="nomeAvoMaterna" placeholder="Avó Materna">
                    </div>
                </div>
            
                <button type="button" class="btn-primary" onclick="gerarArvore()">Gerar Árvore</button>
            </div>
            
            <div class="card">
                <h2>Árvore Gerada</h2>
                <div id="resultado"></div>
            </div>
        </main>

        <script src="/poo-javascript-lab/src/07-arvore-genealogica/exercicio07.js"> </script>

</html>
