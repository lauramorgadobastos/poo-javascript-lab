<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02 - Agenda Telefônica</title>
    <link rel="stylesheet" href="/poo-javascript-lab/styles.css">
    <link rel="stylesheet" href="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.css">
    
</head>

<body>
    <!-- Menu Lateral -->
    <div class="app-container">
        <aside class="sidebar">
            <h2>Exercícios JS</h2>
            <nav>
                <ul>
                    <a href="/poo-javascript-lab/src/01-forma-geometrica/exercicio01.html"><li><button data-ex="1">1. Formas Geométricas</button></li></a>
                    <a href="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.html"><li><button data-ex="2">2. Agenda Telefônica</button></li></a>
                    <li><button data-ex="3">3. Controle de Empréstimo</button></li>
                    <li><button data-ex="4">4. Funcionário & Gerente</button></li>
                    <li><button data-ex="5">5. Simulador de Futebol</button></li>
                    <li><button data-ex="6">6. Supermercado</button></li>
                    <li><button data-ex="7">7. Árvore Genealógica</button></li>
                    <li><button data-ex="8">8. Gestão da Turma</button></li>
                </ul>
            </nav>
        </aside>

        <!-- Main - Contúdo  -->

        <main class="main-content">
          
        <!-- Formulário de Cadastro -->
        <div class="cadastro-section">
            <h2>Novo Contato</h2>
            <form id="form-contato">
                <input type="text" id="nome-input" placeholder="Nome do contato" required>
                <input type="text" id="telefone-input" placeholder="Telefone" required>
                <input type="email" id="email-input" placeholder="E-mail" required>
                <button type="submit" id="adicionar">Adicionar</button>
            </form>
        </div>
        
        <hr>
        
        <!-- Área de Busca -->
        <div class="busca-section">
            <h2>Buscar Contato</h2>
            <input type="text" id="busca-input" placeholder="Digite o nome para buscar">
            <button id="btn-buscar">Buscar</button>
            <button id="btn-limpar">Mostrar Todos</button>
        </div>
        
        <!-- Lista onde os contatos vão aparecer -->
        <div class="lista-section">
            <h2>Minha Agenda</h2>
            <ul id="lista-contatos">
                <!-- Os itens (<li>) serão injetados aqui pelo JavaScript -->
            </ul>
        </div>
           
        </main>
        <script src="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.js"></script>
</body>
</html>
