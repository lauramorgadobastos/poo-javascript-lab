</head>

<body>
    <!-- Menu Lateral -->
    <div class="app-container">
        <aside class="sidebar">
            <h2>Exercícios JS</h2>
            <nav>
                <ul>
                    <a href="/poo-javascript-lab/src/01-forma-geometrica/exercicio01.html">
                        <li><button data-ex="1">1. Formas Geométricas</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.html">
                        <li><button data-ex="2">2. Agenda Telefônica</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/03-controle-de-emprestimo/exercicio03.html">
                        <li><button data-ex="3">3. Controle de Empréstimo</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/04-funcionario-e-gerente/exercicio04.html">
                        <li><button data-ex="4">4. Funcionário & Gerente</button></li>

                    <li><button data-ex="5">5. Simulador de Futebol</button></li>

                </ul>
            </nav>
        </aside>

        <!-- Main - Contúdo  -->

        <main class="main-content">
        <h2>Cálculo de Bônus de Funcionário / Gerente</h2>
        
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </div>
        
        <div class="form-group">
            <label for="salario">Salário:</label>
            <input type="number" id="salario">
        </div>
        
        <div class="form-group">
            <label for="cargo">Cargo:</label>
            <select id="cargo" onchange="togglePessoas()">
                <option value="funcionario">Funcionário</option>
                <option value="gerente">Gerente</option>
            </select>
        </div>
        
        <div class="form-group" id="campoPessoas" style="display: none;">
            <label for="npessoas">Nº de Pessoas Gerenciadas:</label>
            <input type="number" id="npessoas">
        </div>
        
        <button onclick="calcular()">Calcular Bônus</button>
        
        <p id="resultado"></p>

        </main>

        </main>
        <script src="/poo-javascript-lab/src/04-funcionario-e-gerente/exercicio04.js"></script>
</body>
