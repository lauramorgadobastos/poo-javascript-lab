    <link rel="stylesheet" href="/poo-javascript-lab/src/03-controle-de-emprestimo/exercicio03.css">

</head>

<body>
    <!-- Menu Lateral -->
    <div class="app-container">
        <aside class="sidebar">
            <h2>Exercícios JS</h2>
            <nav>
                <ul>
                    <a href="/poo-javascript-lab/src/01-forma-geometrica/exercicio01.html">
                        <li><button data-ex="1">1. Formas Geométricas</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.html">
                        <li><button data-ex="2">2. Agenda Telefônica</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/03-controle-de-emprestimo/exercicio03.html">
                        <li><button data-ex="3">3. Controle de Empréstimo</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/04-funcionario-e-gerente/exercicio04.html">
                        <li><button data-ex="4">4. Funcionário & Gerente</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/05-simulador-de-futebol/exercicio05.html">
                        <li><button data-ex="5">5. Simulador de Futebol</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/06-supermercado/exercicio06.html">
                        <li><button data-ex="6">6. Supermercado</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/07-arvore-genealogica/exercicio07.html">
                        <li><button data-ex="7">7. Árvore Genealógica</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/08-gestao-de-turma/exercicio08.html">
                        <li><button data-ex="8">8. Gestão da Turma</button></li>
                    </a>
                </ul>
            </nav>
            </aside>

        <!-- Main - Contúdo  -->

        <main class="main-content">
            <main class="main-content">
                <h2>Sistema de Biblioteca</h2>
            
                <!-- Formulário para Cadastrar Livro -->
                <section class="card">
                    <h3>Cadastrar Livro</h3>
                    <form id="form-livro">
                        <input type="text" id="livro-nome" placeholder="Nome do Livro" required>
                        <input type="text" id="livro-autor" placeholder="Autor" required>
                        <input type="text" id="livro-editora" placeholder="Editora" required>
                        <input type="number" id="livro-qtd" placeholder="Quantidade" min="1" required>
                        <button type="submit">Salvar Livro</button>
                    </form>
                </section>

                <!-- Formulário para Cadastrar Pessoa -->
                <section class="card">
                    <h3>Cadastrar Pessoa</h3>
                    <form id="form-pessoa">
                        <input type="text" id="pessoa-nome-cad" placeholder="Nome Completo" required>
                        <input type="text" id="pessoa-id-cad" placeholder="Identificação (CPF)" required>
                        <button type="submit">Cadastrar Pessoa</button>
                    </form>
                </section>
            
                <!-- Formulário para Empréstimo -->
                <section class="card">
                    <h3>Realizar Empréstimo</h3>
                    <form id="form-emprestimo">
                        <input type="text" id="pessoa-nome" placeholder="Nome do Usuário" required>
                        <input type="text" id="pessoa-id" placeholder="Identificação (CPF)" required>
                        <input type="text" id="emp-livro-nome" placeholder="Nome do Livro" required>
                        <input type="date" id="emp-data" required>
                        <button type="submit">Confirmar Empréstimo</button>
                    </form>
                </section>

                <!-- Formulário para Devolução -->
                <section class="card">
                    <h3>Devolver Livro</h3>
                    <form id="form-devolucao">
                        <input type="text" id="dev-pessoa-id" placeholder="Identificação da Pessoa (CPF)" required>
                        <input type="text" id="dev-livro-nome" placeholder="Nome do Livro" required>
                        <button type="submit">Devolver Livro</button>
                    </form>
                </section>

            
                <!-- Painel de Feedback -->
                <div id="mensagem-status" style="margin-top: 15px; font-weight: bold;"></div>
            </main>

        </main>
        <script src="/poo-javascript-lab/src/03-controle-de-emprestimo/exercicio03.js"></script>
</body>

</html>
