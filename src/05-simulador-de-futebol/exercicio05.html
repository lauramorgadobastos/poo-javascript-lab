<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exercício 05 - Funcionário & Gerente</title>
    <link rel="stylesheet" href="/poo-javascript-lab/src/styles.css">
    <link rel="stylesheet" href="/poo-javascript-lab/src/05-simulador-de-futebol/exercicio.css">

</head>

<body>
    <!-- Menu Lateral -->
    <div class="app-container">
        <aside class="sidebar">
            <h2>Exercícios JS</h2>
            <nav>
                <ul>
                    <a href="/poo-javascript-lab/src/01-forma-geometrica/exercicio01.html">
                        <li><button data-ex="1">1. Formas Geométricas</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/02-agenda-telefonica/exercicio02.html">
                        <li><button data-ex="2">2. Agenda Telefônica</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/03-controle-de-emprestimo/exercicio03.html">
                        <li><button data-ex="3">3. Controle de Empréstimo</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/04-funcionario-e-gerente/exercicio04.html">
                        <li><button data-ex="4">4. Funcionário & Gerente</button></li>
                    </a>
                    <a href="/poo-javascript-lab/src/05-simulador-de-futebol/exercicio05.html">
                        <li><button data-ex="5">5. Simulador de Futebol</button></li>
                    </a>
                <a href="/poo-javascript-lab/src/06-supermercado/exercicio06.html">
                    <li><button data-ex="6">6. Supermercado</button></li>
                </a>
                    <li><button data-ex="7">7. Árvore Genealógica</button></li>
                    <li><button data-ex="8">8. Gestão da Turma</button></li>
                </ul>
            </nav>
        </aside>

        <!-- Main - Contúdo  -->

        <main class="main-content">

        <h1> Simulador de Futebol</h1>
        
        <form id="form-simulador">
            <div class="teams-grid">
                <!-- Card Time 1 -->
                <div class="card">
                    <h3>Time 1</h3>
                    <div class="input-field">
                        <label for="nomeTime1">Nome do Time:</label>
                        <input type="text" id="nomeTime1" placeholder="Ex: Flamengo" required>
                    </div>
                    <div class="player-input-group" id="container-time1">
                        <!-- Os 11 campos são gerados aqui pelo JS -->
                    </div>
                </div>
        
                <!-- Card Time 2 -->
                <div class="card">
                    <h3>Time 2</h3>
                    <div class="input-field">
                        <label for="nomeTime2">Nome do Time:</label>
                        <input type="text" id="nomeTime2" placeholder="Ex: Vasco" required>
                    </div>
                    <div class="player-input-group" id="container-time2">
                        <!-- Os 11 campos são gerados aqui pelo JS -->
                    </div>
                </div>
            </div>
        
            <button type="submit" class="btn-simular">Simular Partida</button>
        </form>
        
        <!-- Card do Placar -->
        <div class="card" id="resultado">
            <h2>Resultado</h2>
            <p>Preencha os times e clique em simular para ver o placar.</p>
        </div>
           
        </main>
        <script src="/poo-javascript-lab/src/05-simulador-de-futebol/exercicio05.js"> </script>
</body>

</html>
